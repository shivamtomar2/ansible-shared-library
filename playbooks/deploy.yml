---
- name: Kafka Deployment Validation
  hosts: localhost
  connection: local

  vars:
    kafka_version: "3.8.0"
    environment: "{{ lookup('env', 'ENVIRONMENT') | default('prod', true) }}"

  tasks:

    - name: Display deployment information
      debug:
        msg:
          - "Environment: {{ environment }}"
          - "Kafka Version: {{ kafka_version }}"

    - name: Create deployment directory
      file:
        path: /tmp/kafka-deployment
        state: directory

    - name: Create deployment log
      copy:
        dest: /tmp/kafka-deployment/deployment.log
        content: |
          Kafka Deployment Executed
          Environment={{ environment }}
          Version={{ kafka_version }}

    - name: Verify deployment log
      stat:
        path: /tmp/kafka-deployment/deployment.log
      register: deployment_file

    - name: Show verification result
      debug:
        msg: "Kafka deployment validation successful"
      when: deployment_file.stat.exists
